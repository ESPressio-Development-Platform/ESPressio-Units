<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:28px;font-weight:700}.g{font-size:15px;font-weight:700}.n{fill:#fff;stroke:#222;stroke-width:2}.l{font-size:16px}.e{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)}.o{stroke-dasharray:8 6}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text class="t" x="35" y="42">ESPressio Dependency Architecture — Units 0.2.3 context</text><text class="g" x="35" y="82">Foundational</text><rect class="n" x="35" y="100" width="170" height="55" rx="8"/><text class="l" x="63" y="133">Observable 3.0.1</text><rect class="n" x="225" y="100" width="185" height="55" rx="8"/><text class="l" x="248" y="133">Serializable 0.10.2</text><rect class="n" x="430" y="100" width="150" height="55" rx="8"/><text class="l" x="468" y="133">Units 0.2.3</text><rect class="n" x="600" y="100" width="165" height="55" rx="8"/><text class="l" x="632" y="133">Security 0.3.0</text><rect class="n" x="785" y="100" width="165" height="55" rx="8"/><text class="l" x="817" y="133">Command 0.4.0</text><text class="g" x="35" y="205">Runtime / Execution</text><rect class="n" x="250" y="225" width="180" height="55" rx="8"/><text class="l" x="292" y="258">Timing 2.2.4</text><rect class="n" x="570" y="225" width="180" height="55" rx="8"/><text class="l" x="610" y="258">Threads 3.1.4</text><path class="e" d="M315 225 L505 155"/><path class="e" d="M280 225 L150 155"/><path class="e" d="M620 225 L400 155"/><path class="e" d="M590 225 L180 155"/><path class="o e" d="M505 155 L330 155"/><text class="g" x="35" y="330">Event / Integration</text><rect class="n" x="460" y="350" width="180" height="55" rx="8"/><text class="l" x="505" y="383">Event 6.0.0</text><rect class="n" x="110" y="350" width="170" height="55" rx="8"/><text class="l" x="145" y="383">Sockets 0.6.0</text><rect class="n" x="790" y="350" width="180" height="55" rx="8"/><text class="l" x="826" y="383">ESP-Now 0.6.0</text><path class="e" d="M540 350 L650 280"/><path class="e" d="M510 350 L390 280"/><path class="e" d="M495 350 L185 155"/><path class="o e" d="M510 350 L355 155"/><path class="o e" d="M220 350 L465 380"/><path class="o e" d="M790 380 L640 380"/><path class="o e" d="M180 350 L675 155"/><path class="o e" d="M825 350 L705 155"/><path class="o e" d="M185 350 L850 155"/><path class="o e" d="M860 350 L875 155"/><text class="g" x="35" y="465">Diagnostics / Operator</text><rect class="n" x="440" y="490" width="220" height="65" rx="8"/><text class="l" x="490" y="528">Serial 0.6.0</text><path class="o e" d="M470 490 L220 405"/><path class="o e" d="M620 490 L850 405"/><path class="o e" d="M550 490 L550 405"/><path class="o e" d="M480 490 L330 155"/><path class="o e" d="M610 490 L675 155"/><path class="o e" d="M630 490 L870 155"/><text class="l" x="35" y="625">Solid arrows: required dependencies. Dashed arrows: opt-in integrations.</text><text class="l" x="35" y="655">Event 6.0.0 has no reverse dependency on Command, Security, Sockets, or ESP-Now.</text><text class="l" x="35" y="685">Units remains standalone; only Serializable Unit variants opt into Serializable 0.10.2.</text></svg>